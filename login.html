<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ورود | دیوار کوهمره سرخی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            font-family: "Vazirmatn", Tahoma, sans-serif;

            background:
                radial-gradient(circle at 50% -10%,
                    rgba(0, 168, 255, .16),
                    transparent 45%),
                #f6f8fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: #202124;
        }

        .login-wrapper {

            width: 100%;
            max-width: 430px;
        }

        .login-card {

            background: #fff;

            border-radius: 28px;

            padding: 30px 24px 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .09);
        }

        .logo-box {

            width: 76px;
            height: 76px;

            margin: 0 auto 18px;

            border-radius: 23px;

            background:
                linear-gradient(145deg,
                    #00b7ff,
                    #0075d8);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 39px;

            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(0, 119, 217, .20);
        }

        .title {

            text-align: center;

            font-size: 23px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            line-height: 2;

            margin-bottom: 28px;
        }

        .label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .phone-box {

            height: 58px;

            border: 1.5px solid #e4e7eb;

            border-radius: 16px;

            display: flex;

            align-items: center;

            direction: ltr;

            overflow: hidden;

            transition: .2s;
        }

        .phone-box:focus-within {

            border-color: #00a8ff;

            box-shadow:
                0 0 0 4px rgba(0, 168, 255, .09);
        }

        .country-code {

            height: 100%;

            padding: 0 13px;

            display: flex;

            align-items: center;

            gap: 7px;

            border-right: 1px solid #eee;

            font-weight: 600;
        }

        .flag {

            font-size: 23px;
        }

        .phone-input {

            flex: 1;

            height: 100%;

            border: 0;

            outline: none;

            font-size: 16px;

            font-family: "Vazirmatn", Tahoma, sans-serif;

            direction: ltr;

            text-align: left;

            padding: 0 13px;

            background: transparent;
        }

        .login-btn {

            width: 100%;

            height: 57px;

            margin-top: 18px;

            border: 0;

            border-radius: 16px;

            background:
                linear-gradient(135deg,
                    #00a8ff,
                    #0077d9);

            color: white;

            font-family: "Vazirmatn", Tahoma, sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;

            box-shadow:
                0 10px 25px rgba(0, 119, 217, .20);
        }

        .login-btn:active {

            transform: scale(.98);
        }

        .login-btn:disabled {

            opacity: .65;

            cursor: not-allowed;
        }

        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 13px;

            font-size: 12px;

            line-height: 1.8;

            text-align: center;

            display: none;
        }

        .message.error {

            display: block;

            background: #fff1f1;

            color: #d93025;
        }

        .message.success {

            display: block;

            background: #edfff5;

            color: #16834b;
        }

        .terms {

            margin-top: 19px;

            text-align: center;

            font-size: 11px;

            color: #888;

            line-height: 2;
        }

        .security {

            margin-top: 22px;

            padding-top: 15px;

            border-top: 1px solid #eee;

            text-align: center;

            font-size: 11px;

            color: #888;
        }
    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="logo-box">
                د
            </div>

            <div class="title">
                ورود به دیوار کوهمره سرخی
            </div>

            <div class="subtitle">
                برای ورود یا ثبت‌نام، شماره موبایل خود را وارد کنید
            </div>

            <label class="label">
                شماره موبایل
            </label>

            <div class="phone-box">

                <div class="country-code">

                    <span class="flag">
                        🇮🇷
                    </span>

                    <span>
                        +98
                    </span>

                </div>

                <input id="phone" class="phone-input" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10"
                    placeholder="912 345 6789">

            </div>

            <button id="loginBtn" class="login-btn" type="button" onclick="sendCode()">
                دریافت کد تأیید
            </button>

            <div id="message" class="message"></div>

            <div class="terms">

                با ادامه، شما
                <strong>قوانین و شرایط</strong>
                استفاده را می‌پذیرید.

            </div>

            <div class="security">

                🔒 اطلاعات شما نزد ما محفوظ است

            </div>

        </div>

    </div>

    <script>

        /* ================================
           تنظیمات
        ================================ */

        const API_BASE = "";


        /* ================================
           تبدیل اعداد فارسی و عربی
        ================================ */

        function toEnglishNumbers(value) {

            return String(value)

                .replace(
                    /[۰-۹]/g,
                    function (d) {
                        return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
                    }
                )

                .replace(
                    /[٠-٩]/g,
                    function (d) {
                        return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
                    }
                );
        }


        /* ================================
           عناصر
        ================================ */

        const phoneInput =
            document.getElementById("phone");

        const loginBtn =
            document.getElementById("loginBtn");


        /* ================================
           محدود کردن ورودی
        ================================ */

        phoneInput.addEventListener(
            "input",
            function () {

                let value =
                    toEnglishNumbers(this.value);

                value =
                    value.replace(/\D/g, "");

                if (value.startsWith("0")) {
                    value =
                        value.substring(1);
                }

                this.value =
                    value.substring(0, 10);
            }
        );


        /* ================================
           پیام
        ================================ */

        function showMessage(text, type) {

            const box =
                document.getElementById("message");

            box.className =
                "message " + type;

            box.innerHTML =
                text;
        }


        /* ================================
           ارسال OTP
        ================================ */

        async function sendCode() {

            let number =
                toEnglishNumbers(
                    phoneInput.value
                );

            number =
                number.replace(/\D/g, "");

            if (number.startsWith("0")) {
                number =
                    number.substring(1);
            }

            if (!/^9\d{9}$/.test(number)) {

                showMessage(
                    "❌ شماره موبایل صحیح نیست.",
                    "error"
                );

                phoneInput.focus();

                return;
            }

            const phone =
                "0" + number;

            loginBtn.disabled = true;

            loginBtn.textContent =
                "در حال ارسال کد...";

            showMessage(
                "⏳ در حال ارسال درخواست...",
                "success"
            );

            try {

                const response =
                    await fetch(
                        API_BASE + "/api/auth/request",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                phone: phone
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "خطا در ارسال کد"
                    );
                }


                /* ============================
                   اطلاعات موقت ورود
                ============================ */

                localStorage.setItem(
                    "pending_phone",
                    phone
                );

                /*
                 * مسیر برگشت قبلی را حفظ می‌کنیم.
                 * اگر وجود نداشت، post.html
                 */

                let returnUrl =
                    localStorage.getItem(
                        "auth_return_url"
                    );

                if (!returnUrl) {

                    returnUrl =
                        "post.html";

                    localStorage.setItem(
                        "auth_return_url",
                        returnUrl
                    );
                }


                /*
                 * برای تست:
                 * بک‌اند فعلاً devCode را برمی‌گرداند.
                 */

                if (data.devCode) {

                    localStorage.setItem(
                        "dev_verify_code",
                        String(data.devCode)
                    );

                }


                showMessage(
                    "✅ کد تأیید ارسال شد.",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "verify.html";

                    },
                    500
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "ارتباط با سرور برقرار نشد."
                    ),
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "دریافت کد تأیید";
            }

        }


        /* ================================
           Enter
        ================================ */

        phoneInput.addEventListener(
            "keydown",
            function (e) {

                if (e.key === "Enter") {

                    sendCode();

                }

            }
        );

    </script>

</body>

</html>
