<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#087cf0">

    <title>پروفایل | دیوار کوهمره سرخی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "Vazirmatn",
                Tahoma,
                sans-serif;

            background: #f5f7fb;
            color: #172033;

            min-height: 100vh;

            padding-bottom: 90px;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* ==============================
   HEADER
============================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background:
                rgba(255, 255, 255, .94);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid #e6ebf1;
        }

        .header-inner {
            max-width: 900px;
            min-height: 66px;

            margin: auto;

            padding:
                9px 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .back-btn,
        .home-btn {

            width: 42px;
            height: 42px;

            border:
                1px solid #e1e6ed;

            border-radius: 13px;

            background: #fff;

            color: #465367;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .header-title {
            flex: 1;

            text-align: center;

            font-size: 14px;
            font-weight: 900;
        }


        /* ==============================
   MAIN
============================== */

        .main {
            max-width: 900px;

            margin: auto;

            padding:
                15px;
        }


        /* ==============================
   PROFILE CARD
============================== */

        .profile-card {

            background: #fff;

            border:
                1px solid #e4e9ef;

            border-radius: 22px;

            padding: 20px;

            box-shadow:
                0 7px 25px rgba(25, 45, 70, .06);
        }

        .profile-top {

            display: flex;
            align-items: center;

            gap: 13px;
        }

        .avatar {

            width: 62px;
            height: 62px;

            flex: none;

            border-radius: 20px;

            background:
                linear-gradient(135deg,
                    #09a8ff,
                    #0874da);

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: 900;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {

            font-size: 17px;
            font-weight: 900;

            color: #202b3b;
        }

        .user-phone {

            direction: ltr;

            text-align: right;

            margin-top: 4px;

            color: #8b95a3;

            font-size: 10px;
        }


        /* ==============================
   STATS
============================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;

            margin-top: 18px;
        }

        .stat {

            background: #f7f9fb;

            border:
                1px solid #edf0f4;

            border-radius: 14px;

            padding:
                12px 7px;

            text-align: center;
        }

        .stat-number {

            color: #0878df;

            font-size: 18px;

            font-weight: 900;
        }

        .stat-label {

            margin-top: 2px;

            color: #8d97a5;

            font-size: 8px;
        }


        /* ==============================
   ACTIONS
============================== */

        .profile-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: 12px;
        }

        .action-btn {

            height: 43px;

            border-radius: 12px;

            border: 0;

            font-size: 10px;

            font-weight: 800;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;
        }

        .edit-btn {

            color: #0877df;

            background: #edf7ff;

            border:
                1px solid #d9edff;
        }

        .logout-btn {

            color: #d63831;

            background: #fff1f0;

            border:
                1px solid #ffd9d6;
        }


        /* ==============================
   SECTION
============================== */

        .section {

            margin-top: 14px;
        }

        .section-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 9px;
        }

        .section-title {

            font-size: 15px;

            font-weight: 900;

            color: #263244;
        }

        .refresh-btn {

            width: 34px;
            height: 34px;

            border:
                1px solid #e2e7ee;

            border-radius: 10px;

            background: #fff;

            color: #647184;

            font-size: 16px;
        }


        /* ==============================
   ADS
============================== */

        .ads-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        .ad-card {

            overflow: hidden;

            background: #fff;

            border:
                1px solid #e4e9ef;

            border-radius: 17px;

            box-shadow:
                0 5px 18px rgba(25, 45, 70, .05);

            transition:
                transform .18s ease,
                box-shadow .18s ease;
        }

        .ad-card:active {

            transform: scale(.985);
        }

        .ad-image {

            width: 100%;

            aspect-ratio: 1/0.78;

            background:
                linear-gradient(135deg,
                    #edf2f7,
                    #f8fafc);

            overflow: hidden;
        }

        .ad-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .no-image {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #9ca6b4;

            font-size: 27px;
        }

        .ad-content {

            padding:
                10px;
        }

        .ad-title {

            font-size: 11px;

            font-weight: 800;

            line-height: 1.8;

            color: #263244;

            display:
                -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            min-height: 40px;
        }

        .ad-price {

            margin-top: 5px;

            color: #0877df;

            font-size: 11px;

            font-weight: 900;
        }

        .ad-location {

            margin-top: 4px;

            color: #919aa8;

            font-size: 8px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .ad-status {

            margin-top: 8px;

            padding:
                5px 7px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 700;

            text-align: center;
        }

        .ad-status.approved {

            color: #147946;

            background: #edfff5;
        }

        .ad-status.pending {

            color: #9a6800;

            background: #fff8df;
        }

        .ad-status.rejected {

            color: #c42f28;

            background: #fff1f0;
        }


        /* ==============================
   EMPTY
============================== */

        .empty {

            background: #fff;

            border:
                1px solid #e4e9ef;

            border-radius: 19px;

            padding: 35px 20px;

            text-align: center;
        }

        .empty-icon {

            width: 66px;
            height: 66px;

            margin:
                0 auto 13px;

            border-radius: 21px;

            background: #f1f7fc;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;
        }

        .empty-title {

            font-size: 14px;

            font-weight: 900;

            color: #354154;
        }

        .empty-text {

            margin-top: 6px;

            color: #919aa7;

            font-size: 10px;

            line-height: 1.9;
        }

        .post-btn {

            margin-top: 15px;

            height: 43px;

            padding:
                0 18px;

            border: 0;

            border-radius: 12px;

            color: #fff;

            background:
                linear-gradient(135deg,
                    #09a8ff,
                    #0875df);

            font-size: 10px;

            font-weight: 800;
        }


        /* ==============================
   LOADING
============================== */

        .loading {

            padding: 35px;

            text-align: center;

            color: #919aa7;

            font-size: 10px;
        }

        .spinner {

            width: 35px;
            height: 35px;

            margin:
                0 auto 10px;

            border:
                3px solid #e6ebf1;

            border-top-color: #087cf0;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ==============================
   ERROR
============================== */

        .error {

            background: #fff;

            border:
                1px solid #e4e9ef;

            border-radius: 19px;

            padding: 25px;

            text-align: center;
        }

        .error-icon {

            width: 60px;
            height: 60px;

            margin:
                0 auto 10px;

            border-radius: 19px;

            background: #fff1f0;

            color: #d63831;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .error-title {

            font-size: 14px;
            font-weight: 900;
        }

        .error-text {

            margin-top: 6px;

            color: #8c96a4;

            font-size: 10px;
        }


        /* ==============================
   MOBILE NAV
============================== */

        .bottom-nav {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 900;

            padding:
                8px 12px calc(8px + env(safe-area-inset-bottom));

            background:
                rgba(255, 255, 255, .95);

            backdrop-filter: blur(18px);

            border-top:
                1px solid #e5eaf0;
        }

        .bottom-inner {

            max-width: 600px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 5px;
        }

        .nav-item {

            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 3px;

            border-radius: 13px;

            color: #8994a3;

            font-size: 8px;

            font-weight: 700;
        }

        .nav-item span:first-child {

            font-size: 19px;
        }

        .nav-item.active {

            color: #0878df;

            background: #edf7ff;
        }


        /* ==============================
   DESKTOP
============================== */

        @media(min-width:700px) {

            .main {

                padding:
                    22px 18px 110px;
            }

            .ads-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

            .profile-card {

                padding: 25px;
            }

        }


        /* ==============================
   SMALL MOBILE
============================== */

        @media(max-width:380px) {

            .main {

                padding:
                    10px 10px 90px;
            }

            .ads-grid {

                gap: 7px;
            }

            .ad-content {

                padding: 8px;
            }

        }
    </style>

</head>


<body>


    <!-- =====================================================
     HEADER
===================================================== -->

    <header class="header">

        <div class="header-inner">

            <button class="back-btn" type="button" onclick="goBack()">
                ‹
            </button>

            <div class="header-title">
                پروفایل من
            </div>

            <a href="index.html" class="home-btn">
                ⌂
            </a>

        </div>

    </header>



    <!-- =====================================================
     MAIN
===================================================== -->

    <main class="main">


        <!-- PROFILE -->

        <section class="profile-card">

            <div class="profile-top">

                <div id="avatar" class="avatar">
                    کاربر
                </div>


                <div class="user-info">

                    <div id="userName" class="user-name">
                        در حال دریافت...
                    </div>

                    <div id="userPhone" class="user-phone">
                        -
                    </div>

                </div>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">

                    <div id="totalAds" class="stat-number">
                        ۰
                    </div>

                    <div class="stat-label">
                        کل آگهی‌ها
                    </div>

                </div>


                <div class="stat">

                    <div id="approvedAds" class="stat-number">
                        ۰
                    </div>

                    <div class="stat-label">
                        منتشر شده
                    </div>

                </div>


                <div class="stat">

                    <div id="pendingAds" class="stat-number">
                        ۰
                    </div>

                    <div class="stat-label">
                        در انتظار
                    </div>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="profile-actions">

                <button class="action-btn edit-btn" type="button" onclick="editProfile()">
                    ✏️ ویرایش پروفایل
                </button>


                <button class="action-btn logout-btn" type="button" onclick="logout()">
                    🚪 خروج
                </button>

            </div>

        </section>



        <!-- MY ADS -->

        <section class="section">

            <div class="section-header">

                <div class="section-title">
                    آگهی‌های من
                </div>

                <button id="refreshBtn" class="refresh-btn" type="button" onclick="loadMyAds()" title="بروزرسانی">
                    ↻
                </button>

            </div>


            <div id="adsContainer">

                <div class="loading">

                    <div class="spinner"></div>

                    در حال دریافت آگهی‌ها...

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
     BOTTOM NAV
===================================================== -->

    <nav class="bottom-nav">

        <div class="bottom-inner">

            <a href="index.html" class="nav-item">

                <span>⌂</span>

                <span>
                    خانه
                </span>

            </a>


            <a href="post.html" class="nav-item">

                <span>＋</span>

                <span>
                    ثبت آگهی
                </span>

            </a>


            <a href="profile.html" class="nav-item active">

                <span>♙</span>

                <span>
                    پروفایل
                </span>

            </a>

        </div>

    </nav>



    <script>

        /* =====================================================
           CONFIG
        ===================================================== */

        const API_BASE = "";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const userName =
            document.getElementById(
                "userName"
            );

        const userPhone =
            document.getElementById(
                "userPhone"
            );

        const avatar =
            document.getElementById(
                "avatar"
            );

        const totalAds =
            document.getElementById(
                "totalAds"
            );

        const approvedAds =
            document.getElementById(
                "approvedAds"
            );

        const pendingAds =
            document.getElementById(
                "pendingAds"
            );

        const adsContainer =
            document.getElementById(
                "adsContainer"
            );


        /* =====================================================
           AUTH TOKEN
        ===================================================== */

        const authToken =
            localStorage.getItem(
                "auth_token"
            );


        /* =====================================================
           AUTH CHECK
        ===================================================== */

        if (!authToken) {

            const currentUrl =
                window.location.href;

            localStorage.setItem(
                "auth_return_url",
                currentUrl
            );

            window.location.href =
                "login.html";

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           FORMAT PRICE
        ===================================================== */

        function formatPrice(price) {

            const number =
                Number(price || 0);


            if (
                !Number.isFinite(number) ||
                number <= 0
            ) {

                return "توافقی";

            }


            return (
                new Intl.NumberFormat(
                    "fa-IR"
                ).format(number)
                +
                " تومان"
            );

        }


        /* =====================================================
           STATUS
        ===================================================== */

        function getStatus(
            status
        ) {

            switch (
            String(status || "").toLowerCase()
            ) {

                case "approved":

                    return {
                        className: "approved",
                        text: "✓ منتشر شده"
                    };


                case "rejected":

                    return {
                        className: "rejected",
                        text: "✕ رد شده"
                    };


                case "pending":

                default:

                    return {
                        className: "pending",
                        text: "⏳ در انتظار بررسی"
                    };

            }

        }


        /* =====================================================
           LOAD USER
        ===================================================== */

        async function loadUser() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/me",
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    authToken
                            },

                            cache: "no-store"
                        }
                    );


                if (
                    response.status === 401
                ) {

                    logout(false);

                    return;

                }


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "اطلاعات کاربر دریافت نشد."
                    );

                }


                const user =
                    data.user;


                const fullName =
                    (
                        user.name ||
                        ""
                    ) +
                    (
                        user.family_name
                            ?
                            " " +
                            user.family_name
                            :
                            ""
                    );


                const finalName =
                    fullName.trim() ||
                    "کاربر";


                userName.textContent =
                    finalName;


                userPhone.textContent =
                    user.phone
                        ?
                        "۰" + user.phone
                        :
                        "-";


                avatar.textContent =
                    finalName
                        .trim()
                        .charAt(0) ||
                    "ک";


            } catch (error) {

                console.error(
                    "LOAD USER ERROR:",
                    error
                );


                userName.textContent =
                    "کاربر";


                userPhone.textContent =
                    "-";

            }

        }


        /* =====================================================
           LOAD MY ADS
        ===================================================== */

        async function loadMyAds() {

            adsContainer.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            در حال دریافت آگهی‌ها...

        </div>

    `;


            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/my-ads",
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    authToken
                            },

                            cache: "no-store"
                        }
                    );


                if (
                    response.status === 401
                ) {

                    logout(false);

                    return;

                }


                let data = {};


                try {

                    data =
                        await response.json();

                } catch (error) {

                    data = {};

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "دریافت آگهی‌ها ناموفق بود."
                    );

                }


                if (
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "اطلاعات آگهی‌ها دریافت نشد."
                    );

                }


                const ads =
                    Array.isArray(data.ads)
                        ?
                        data.ads
                        :
                        [];


                updateStats(
                    ads
                );


                renderAds(
                    ads
                );


            } catch (error) {

                console.error(
                    "LOAD MY ADS ERROR:",
                    error
                );


                adsContainer.innerHTML = `

            <div class="error">

                <div class="error-icon">
                    !
                </div>

                <div class="error-title">
                    خطا در دریافت آگهی‌ها
                </div>

                <div class="error-text">
                    ${escapeHTML(
                    error.message ||
                    "لطفاً دوباره تلاش کنید."
                )}
                </div>

            </div>

        `;

            }

        }


        /* =====================================================
           UPDATE STATS
        ===================================================== */

        function updateStats(ads) {

            const total =
                ads.length;


            const approved =
                ads.filter(
                    function (ad) {

                        return (
                            String(
                                ad.status || ""
                            ).toLowerCase()
                            ===
                            "approved"
                        );

                    }
                ).length;


            const pending =
                ads.filter(
                    function (ad) {

                        return (
                            String(
                                ad.status || ""
                            ).toLowerCase()
                            ===
                            "pending"
                        );

                    }
                ).length;


            totalAds.textContent =
                new Intl.NumberFormat(
                    "fa-IR"
                ).format(total);


            approvedAds.textContent =
                new Intl.NumberFormat(
                    "fa-IR"
                ).format(approved);


            pendingAds.textContent =
                new Intl.NumberFormat(
                    "fa-IR"
                ).format(pending);

        }


        /* =====================================================
           GET FIRST IMAGE
        ===================================================== */

        function getFirstImage(ad) {

            if (
                !Array.isArray(ad.images)
            ) {

                return null;

            }


            const image =
                ad.images.find(
                    function (item) {

                        return (
                            typeof item === "string" &&
                            item.startsWith(
                                "data:image/"
                            )
                        );

                    }
                );


            return image || null;

        }


        /* =====================================================
           RENDER ADS
        ===================================================== */

        function renderAds(ads) {

            if (
                !ads ||
                ads.length === 0
            ) {

                adsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <div class="empty-title">
                    هنوز آگهی ثبت نکرده‌اید
                </div>

                <div class="empty-text">
                    اولین آگهی خود را ثبت کنید
                    تا در این قسمت نمایش داده شود.
                </div>

                <button
                    class="post-btn"
                    type="button"
                    onclick="window.location.href='post.html'"
                >
                    ＋ ثبت اولین آگهی
                </button>

            </div>

        `;

                return;

            }


            adsContainer.innerHTML = `

        <div class="ads-grid">

            ${ads.map(
                function (ad) {

                    return renderAdCard(
                        ad
                    );

                }
            ).join("")
                }

        </div>

    `;

        }


        /* =====================================================
           AD CARD
        ===================================================== */

        function renderAdCard(ad) {

            const image =
                getFirstImage(
                    ad
                );


            const status =
                getStatus(
                    ad.status
                );


            const location =
                ad.location ||
                (
                    ad.village
                        ?
                        "کوهمره سرخی، " +
                        ad.village
                        :
                        ad.region ||
                        "کوهمره سرخی"
                );


            return `

        <a
            class="ad-card"
            href="ad.html?id=${encodeURIComponent(ad.id)}"
        >

            <div class="ad-image">

                ${image
                    ?
                    `
                    <img
                        src="${image}"
                        alt="${escapeHTML(ad.title)}"
                        loading="lazy"
                    >
                    `
                    :
                    `
                    <div class="no-image">
                        🖼️
                    </div>
                    `
                }

            </div>


            <div class="ad-content">

                <div class="ad-title">

                    ${escapeHTML(
                    ad.title ||
                    "بدون عنوان"
                )}

                </div>


                <div class="ad-price">

                    ${formatPrice(
                    ad.price
                )}

                </div>


                <div class="ad-location">

                    📍
                    ${escapeHTML(
                    location
                )}

                </div>


                <div
                    class="ad-status ${status.className}"
                >

                    ${status.text}

                </div>

            </div>

        </a>

    `;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout(
            ask = true
        ) {

            if (
                ask &&
                !confirm(
                    "آیا می‌خواهید از حساب کاربری خارج شوید؟"
                )
            ) {

                return;

            }


            localStorage.removeItem(
                "auth_token"
            );

            localStorage.removeItem(
                "pending_phone"
            );

            localStorage.removeItem(
                "auth_return_url"
            );

            localStorage.removeItem(
                "is_logged_in"
            );

            localStorage.removeItem(
                "user_id"
            );

            localStorage.removeItem(
                "user_phone"
            );

            /*
               مهم:
               my_ads اصلاً استفاده نمی‌شود.
               حتی اگر از نسخه قدیمی باقی مانده باشد
               منبع اطلاعات نیست.
            */

            window.location.href =
                "login.html";

        }


        /* =====================================================
           EDIT PROFILE
        ===================================================== */

        function editProfile() {

            alert(
                "بخش ویرایش نام، نام خانوادگی و ایمیل را در مرحله بعد اضافه می‌کنیم."
            );

        }


        /* =====================================================
           BACK
        ===================================================== */

        function goBack() {

            if (
                document.referrer &&
                document.referrer.includes(
                    window.location.host
                )
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "index.html";

            }

        }


        /* =====================================================
           START
        ===================================================== */

        if (authToken) {

            loadUser();

            loadMyAds();

        }

    </script>
