<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>تایید شماره | دیوار کوهمره سرخی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #00a8ff;
            --primary-dark: #0077d9;
            --text: #202124;
            --muted: #777;
            --border: #e4e7eb;
            --bg: #f5f8fc;
            --white: #fff;
            --success: #16834b;
            --danger: #d93025;
        }

        body {

            font-family: "Vazirmatn", Tahoma, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: var(--text);

            background:
                radial-gradient(circle at 50% -10%,
                    rgba(0, 168, 255, .18),
                    transparent 45%),
                var(--bg);
        }

        .container {

            width: 100%;

            max-width: 430px;

            animation: pageIn .45s ease;
        }

        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {

            background: rgba(255, 255, 255, .96);

            border: 1px solid rgba(255, 255, 255, .9);

            border-radius: 30px;

            padding: 30px 24px 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .10);

            backdrop-filter: blur(18px);
        }

        .logo {

            width: 76px;

            height: 76px;

            margin: 0 auto 18px;

            border-radius: 23px;

            background:
                linear-gradient(145deg,
                    #00b7ff,
                    #0075d8);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            font-size: 39px;

            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(0, 119, 217, .28);
        }

        .title {

            text-align: center;

            font-size: 23px;

            font-weight: 800;

            margin-bottom: 9px;
        }

        .subtitle {

            text-align: center;

            color: var(--muted);

            font-size: 13px;

            line-height: 2;
        }

        .phone {

            direction: ltr;

            text-align: center;

            color: var(--primary-dark);

            font-size: 15px;

            font-weight: 700;

            margin-top: 3px;
        }

        .code-demo {

            margin-top: 20px;

            padding: 13px;

            border-radius: 15px;

            background: #eef8ff;

            border: 1px solid #ccecff;

            text-align: center;

            color: var(--primary-dark);

            font-size: 12px;

            line-height: 1.8;
        }

        .code-demo strong {

            display: block;

            font-size: 23px;

            letter-spacing: 6px;
        }

        .inputs {

            display: flex;

            direction: ltr;

            justify-content: center;

            gap: 8px;

            margin-top: 24px;
        }

        .inputs input {

            width: 45px;

            height: 56px;

            border: 1.5px solid var(--border);

            border-radius: 14px;

            outline: none;

            background: #fff;

            font-family: "Vazirmatn", Tahoma, sans-serif;

            font-size: 22px;

            font-weight: 700;

            text-align: center;

            color: var(--text);

            transition: .2s;
        }

        .inputs input:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(0, 168, 255, .10);

            transform: translateY(-1px);
        }

        .verify-btn {

            width: 100%;

            height: 57px;

            margin-top: 23px;

            border: 0;

            border-radius: 16px;

            background:
                linear-gradient(135deg,
                    #00a8ff,
                    #0077d9);

            color: #fff;

            font-family: "Vazirmatn", Tahoma, sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(0, 119, 217, .20);

            transition: .2s;
        }

        .verify-btn:active {

            transform: scale(.98);
        }

        .verify-btn:disabled {

            opacity: .65;

            cursor: not-allowed;
        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px 14px;

            border-radius: 13px;

            font-size: 12px;

            line-height: 1.9;

            text-align: center;
        }

        .message.error {

            display: block;

            background: #fff1f1;

            color: var(--danger);
        }

        .message.success {

            display: block;

            background: #edfff5;

            color: var(--success);
        }

        .timer {

            margin-top: 17px;

            text-align: center;

            color: #888;

            font-size: 12px;
        }

        .timer span {

            color: var(--primary-dark);

            font-weight: 700;
        }

        .resend-btn {

            display: none;

            margin: 8px auto 0;

            border: 0;

            background: transparent;

            color: var(--primary-dark);

            font-family: "Vazirmatn", Tahoma, sans-serif;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }

        .resend-btn:disabled {

            opacity: .5;

            cursor: not-allowed;
        }

        .back {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 19px;

            color: #666;

            text-decoration: none;

            font-size: 12px;
        }

        .back:active {

            color: var(--primary-dark);
        }

        .security {

            margin-top: 22px;

            padding-top: 17px;

            border-top: 1px solid #eee;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            color: #888;

            font-size: 11px;
        }

        @media(max-width:380px) {

            .card {

                padding:
                    25px 18px 20px;

                border-radius: 24px;
            }

            .title {

                font-size: 21px;
            }

            .inputs {

                gap: 6px;
            }

            .inputs input {

                width: 42px;

                height: 53px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                د
            </div>

            <div class="title">
                تایید شماره موبایل
            </div>

            <div class="subtitle">

                کد تأیید برای شماره زیر ارسال شد

                <div id="phone" class="phone">
                    -
                </div>

            </div>

            <div class="code-demo">

                کد تأیید تستی شما:

                <strong id="demoCode">
                    ------
                </strong>

            </div>

            <div class="inputs">

                <input type="tel" inputmode="numeric" maxlength="1" autocomplete="one-time-code">

                <input type="tel" inputmode="numeric" maxlength="1">

                <input type="tel" inputmode="numeric" maxlength="1">

                <input type="tel" inputmode="numeric" maxlength="1">

                <input type="tel" inputmode="numeric" maxlength="1">

                <input type="tel" inputmode="numeric" maxlength="1">

            </div>

            <button id="verifyBtn" class="verify-btn" type="button" onclick="verifyCode()">

                تأیید و ادامه

            </button>

            <div id="message" class="message"></div>

            <div class="timer">

                ارسال مجدد کد تا

                <span id="time">
                    60
                </span>

                ثانیه

            </div>

            <button id="resendBtn" class="resend-btn" type="button" onclick="resendCode()">

                ارسال مجدد کد

            </button>

            <a href="login.html" class="back">

                ← تغییر شماره موبایل

            </a>

            <div class="security">

                <span>🔒</span>

                <span>
                    اطلاعات شما نزد ما محفوظ است
                </span>

            </div>

        </div>

    </div>

    <script>

        /* =====================================
           تبدیل اعداد فارسی و عربی
        ===================================== */

        function toEnglishNumbers(value) {

            return String(value || "")

                .replace(
                    /[۰-۹]/g,
                    function (d) {
                        return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
                    }
                )

                .replace(
                    /[٠-٩]/g,
                    function (d) {
                        return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
                    }
                );
        }


        /* =====================================
           نرمال‌سازی شماره
        ===================================== */

        function normalizePhone(value) {

            value =
                toEnglishNumbers(value)
                    .replace(/\D/g, "");

            if (value.startsWith("0098")) {
                value = value.substring(4);
            }

            if (value.startsWith("+98")) {
                value = value.substring(3);
            }

            if (value.startsWith("98")) {
                value = value.substring(2);
            }

            if (value.startsWith("0")) {
                value = value.substring(1);
            }

            return value.slice(0, 10);
        }


        /* =====================================
           اطلاعات
        ===================================== */

        let phone =
            localStorage.getItem("pending_phone");

        let returnUrl =
            localStorage.getItem("auth_return_url");

        if (!returnUrl) {

            returnUrl = "post.html";
        }


        /* =====================================
           بررسی شماره
        ===================================== */

        if (!phone) {

            window.location.replace("login.html");

        }


        /* =====================================
           نمایش شماره
        ===================================== */

        document.getElementById("phone").textContent =
            phone || "-";


        /* =====================================
           OTP نمایشی
           فقط برای حالتی است که login.html
           devCode را در localStorage ذخیره کرده باشد.
           اعتبارسنجی هرگز با این مقدار انجام نمی‌شود.
        ===================================== */

        const storedDevCode =
            localStorage.getItem("verify_code");

        if (storedDevCode) {

            document.getElementById("demoCode").textContent =
                storedDevCode;

        }


        /* =====================================
           ورودی‌ها
        ===================================== */

        const inputs =
            document.querySelectorAll(".inputs input");


        inputs.forEach(function (input, index) {

            input.addEventListener(
                "input",
                function () {

                    this.value =
                        toEnglishNumbers(
                            this.value
                        )
                            .replace(/\D/g, "")
                            .slice(0, 1);

                    if (
                        this.value &&
                        index < inputs.length - 1
                    ) {

                        inputs[index + 1].focus();

                    }

                }
            );


            input.addEventListener(
                "keydown",
                function (e) {

                    if (
                        e.key === "Backspace" &&
                        !this.value &&
                        index > 0
                    ) {

                        inputs[index - 1].focus();

                    }

                }
            );


            input.addEventListener(
                "paste",
                function (e) {

                    e.preventDefault();

                    const pasted =
                        toEnglishNumbers(
                            e.clipboardData.getData("text")
                        )
                            .replace(/\D/g, "")
                            .slice(0, 6);

                    for (
                        let i = 0;
                        i < pasted.length;
                        i++
                    ) {

                        if (inputs[i]) {

                            inputs[i].value =
                                pasted[i];

                        }

                    }

                    if (pasted.length) {

                        inputs[
                            Math.min(
                                pasted.length - 1,
                                inputs.length - 1
                            )
                        ].focus();

                    }

                }
            );

        });


        /* =====================================
           پیام
        ===================================== */

        function showMessage(text, type) {

            const message =
                document.getElementById("message");

            message.className =
                "message " + type;

            message.innerHTML =
                text;
        }


        /* =====================================
           گرفتن کد
        ===================================== */

        function getEnteredCode() {

            let code = "";

            inputs.forEach(function (input) {

                code +=
                    toEnglishNumbers(
                        input.value
                    );

            });

            return code;
        }


        /* =====================================
           تایید OTP از طریق سرور
        ===================================== */

        async function verifyCode() {

            const enteredCode =
                getEnteredCode();

            const btn =
                document.getElementById("verifyBtn");


            if (enteredCode.length !== 6) {

                showMessage(
                    "❌ لطفاً هر ۶ رقم کد را وارد کنید.",
                    "error"
                );

                return;

            }


            if (!phone) {

                showMessage(
                    "❌ شماره موبایل پیدا نشد. دوباره وارد شوید.",
                    "error"
                );

                return;

            }


            btn.disabled = true;

            btn.textContent =
                "در حال بررسی...";


            try {

                const response =
                    await fetch(
                        "/api/auth/verify",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                phone:
                                    normalizePhone(phone),

                                code:
                                    enteredCode

                            })
                        }
                    );


                let data = {};

                try {

                    data =
                        await response.json();

                } catch (e) {

                    data = {};

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "کد تأیید اشتباه است."
                    );

                }


                /* =================================
                   دریافت JWT
                ================================= */

                const token =
                    data.token ||
                    data.accessToken ||
                    data.access_token;


                if (!token) {

                    throw new Error(
                        "ورود انجام شد اما توکن احراز هویت از سرور دریافت نشد."
                    );

                }


                /* =================================
                   ذخیره وضعیت ورود
                ================================= */

                localStorage.setItem(
                    "auth_token",
                    token
                );

                localStorage.setItem(
                    "is_logged_in",
                    "true"
                );

                localStorage.setItem(
                    "otp_verified",
                    "true"
                );

                localStorage.setItem(
                    "logged_in",
                    "true"
                );


                localStorage.setItem(
                    "user_phone",
                    normalizePhone(phone)
                );

                localStorage.setItem(
                    "verified_phone",
                    normalizePhone(phone)
                );

                localStorage.setItem(
                    "phone",
                    normalizePhone(phone)
                );


                if (data.userId) {

                    localStorage.setItem(
                        "user_id",
                        String(data.userId)
                    );

                }


                /* =================================
                   پاک کردن OTP موقت
                ================================= */

                localStorage.removeItem(
                    "verify_code"
                );

                localStorage.removeItem(
                    "pending_phone"
                );


                showMessage(
                    "✅ شماره موبایل با موفقیت تأیید شد.",
                    "success"
                );


                btn.textContent =
                    "ورود موفق ✓";


                clearInterval(timer);


                setTimeout(
                    function () {

                        window.location.replace(
                            returnUrl
                        );

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "OTP VERIFY ERROR:",
                    error
                );


                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "خطا در تأیید کد."
                    ),
                    "error"
                );


                btn.disabled = false;

                btn.textContent =
                    "تأیید و ادامه";

            }

        }


        /* =====================================
           ارسال مجدد OTP از سرور
        ===================================== */

        async function resendCode() {

            const resendBtn =
                document.getElementById("resendBtn");


            if (!phone) {

                showMessage(
                    "❌ شماره موبایل پیدا نشد.",
                    "error"
                );

                return;

            }


            resendBtn.disabled = true;

            resendBtn.textContent =
                "در حال ارسال...";


            try {

                const response =
                    await fetch(
                        "/api/auth/request",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                phone:
                                    normalizePhone(phone)

                            })
                        }
                    );


                let data = {};

                try {

                    data =
                        await response.json();

                } catch (e) {

                    data = {};

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "خطا در ایجاد کد جدید."
                    );

                }


                /* =================================
                   نمایش devCode در حالت توسعه
                ================================= */

                if (data.devCode) {

                    document.getElementById(
                        "demoCode"
                    ).textContent =
                        data.devCode;


                    localStorage.setItem(
                        "verify_code",
                        String(data.devCode)
                    );

                }


                inputs.forEach(function (input) {

                    input.value = "";

                });


                inputs[0].focus();


                showMessage(
                    "📱 کد تأیید جدید از سرور ایجاد شد.",
                    "success"
                );


                startTimer();


            } catch (error) {

                console.error(
                    "OTP REQUEST ERROR:",
                    error
                );


                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "خطا در درخواست کد."
                    ),
                    "error"
                );


            } finally {

                resendBtn.disabled = false;

                resendBtn.textContent =
                    "ارسال مجدد کد";

            }

        }


        /* =====================================
           تایمر
        ===================================== */

        let seconds = 60;

        let timer = null;


        function startTimer() {

            seconds = 60;


            document.getElementById(
                "time"
            ).textContent =
                seconds;


            document.getElementById(
                "resendBtn"
            ).style.display =
                "none";


            clearInterval(timer);


            timer =
                setInterval(
                    function () {

                        seconds--;


                        document.getElementById(
                            "time"
                        ).textContent =
                            seconds;


                        if (seconds <= 0) {

                            clearInterval(timer);


                            document.getElementById(
                                "time"
                            ).textContent =
                                "تمام شد";


                            document.getElementById(
                                "resendBtn"
                            ).style.display =
                                "block";

                        }

                    },
                    1000
                );

        }


        /* =====================================
           شروع
        ===================================== */

        startTimer();


        setTimeout(
            function () {

                if (inputs[0]) {

                    inputs[0].focus();

                }

            },
            300
        );

    </script>

</body>

</html>
